[project]
name = "ticketrouter"
version = "1.0.0"
description = "Support ticket classification and routing with a model cascade: rules, a calibrated classical model, then Claude Haiku and Opus only when unsure."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
ticketrouter = "ticketrouter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticketrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
